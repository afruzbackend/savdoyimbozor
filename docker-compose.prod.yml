# PRODUCTION qatlami (faqat HTTPS). Ishga tushirish:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# docker-compose.yml o'zi — lokal demo (http://localhost, xavfsiz cookie o'chiq).
# Bu fayl demo yumshatishlarini bekor qiladi va majburiy qiymatlarsiz ishga TUSHMAYDI.
# To'liq tartib: docs/DEPLOY.md

x-prod-env: &prod_env
  # HTTPS majburiy, cookie faqat https, HSTS 1 yil
  SECURE_SSL_REDIRECT: "True"
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: "31536000"
  # Majburiy — bo'sh bo'lsa compose to'xtaydi (demo qiymatlari bilan ochilib qolmasin)
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?.env da ALLOWED_HOSTS (masalan bozor.soliq.uz)}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?.env da CSRF_TRUSTED_ORIGINS (https://bozor.soliq.uz)}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?.env da PUBLIC_BASE_URL (xaridor QR cheki manzili)}
  DATABASE_URL: postgres://bozor:${DB_PASSWORD:?.env da DB_PASSWORD (kuchli parol)}@db:5432/bozor
  BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:?.env da BACKUP_UPLOAD_CMD — zaxira tashqi joyga yuborilishi SHART}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENV: production
  APP_RELEASE: ${APP_RELEASE:-}
  HEALTH_TOKEN: ${HEALTH_TOKEN:-}
  STAFF_IDLE_MINUTES: ${STAFF_IDLE_MINUTES:-60}

services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env da DB_PASSWORD}

  redis:
    restart: unless-stopped
    # Tashqariga port ochilmagan — faqat ichki tarmoq. Diskka yozish (qayta ishga tushsa navbat qolsin)
    command: redis-server --appendonly yes

  web:
    restart: unless-stopped
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4} --timeout 60 --max-requests 2000 --max-requests-jitter 200
      --access-logfile - --forwarded-allow-ips="*"
    environment:
      <<: *prod_env

  celery:
    restart: unless-stopped
    environment:
      <<: *prod_env

  beat:
    restart: unless-stopped
    environment:
      <<: *prod_env

  nginx:
    restart: unless-stopped
    ports:
      - "443:443"   # 80 — asosiy fayldan (ACME + https'ga yo'naltirish)
    volumes:
      - ./docker/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/acme:/var/www/acme:ro

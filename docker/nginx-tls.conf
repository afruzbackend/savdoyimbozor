# PRODUCTION: faqat HTTPS. docker-compose.prod.yml bilan ishlatiladi.
# Sertifikat: ./docker/certs/fullchain.pem va privkey.pem (Let's Encrypt yoki davlat CA) —
# batafsil docs/DEPLOY.md. Uch interfeys bitta web'ga proksi — Django rol bo'yicha ajratadi.
upstream django {
    server web:8000;
    keepalive 16;
}

# 80-port: faqat sertifikat yangilash (ACME) va HTTPS'ga yo'naltirish
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;             # nginx versiyasi oshkor qilinmaydi
    client_max_body_size 20M;      # nakladnoy / rasta fotosi
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /static/;
        expires 30d;               # fayl nomida xesh — abadiy keshlasa bo'ladi
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # Media OCHIQ EMAS: Django ruxsatni tekshiradi va X-Accel-Redirect bilan shu yerga yuboradi
    location /protected-media/ {
        internal;
        alias /media/;
    }
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

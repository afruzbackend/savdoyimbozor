# PRODUCTION: faqat HTTPS. docker-compose.prod.yml bilan ishlatiladi.
# Sertifikat: ./docker/certs/fullchain.pem va privkey.pem (Let's Encrypt yoki davlat CA) —
# batafsil docs/DEPLOY.md. Uch interfeys bitta web'ga proksi — Django rol bo'yicha ajratadi.
upstream django {
    server web:8000;
    keepalive 16;
}

# So'rov chegaralari — ilova ichidagi cheklovga (login bloki, API throttling) QO'SHIMCHA qatlam:
# skript bilan minglab so'rov yuborish gunicorn'gacha yetib bormaydi. Chegaralar keng: bozordagi
# sotuvchilar mobil operator NAT'i ortida bitta IP'dan chiqishi mumkin.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
limit_req_status 429;

# 80-port: faqat sertifikat yangilash (ACME) va HTTPS'ga yo'naltirish
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;             # nginx versiyasi oshkor qilinmaydi
    client_max_body_size 20M;      # nakladnoy / rasta fotosi
    proxy_read_timeout 60s;
    # Sekin ulanish hujumi (slowloris) — ulanish uzoq band qilib turilmasin
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /static/;
        expires 30d;               # fayl nomida xesh — abadiy keshlasa bo'ladi
        gzip_static on;            # collectstatic oldindan siqqan .gz nusxa (CPU sarflanmaydi)
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;   # location'da add_header server'dagini bekor qiladi
        access_log off;
    }
    location = /login/ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /chek/ {              # ochiq (xaridor QR cheki) — login yo'q, shuning uchun qattiqroq
        limit_req zone=public burst=20 nodelay;
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    # Media OCHIQ EMAS: Django ruxsatni tekshiradi va X-Accel-Redirect bilan shu yerga yuboradi
    location /protected-media/ {
        internal;
        alias /media/;
    }
    location / {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

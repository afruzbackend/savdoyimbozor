# Uch interfeys ham bitta web'ga proksi qilinadi — Django host-routing o'zi ajratadi
# (sotuvchi.* / nazorat.* / panel.*). Statik va media nginx orqali beriladi.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    client_header_timeout 15s;
    client_body_timeout 30s;

    location /static/ {
        alias /static/;
        expires 30d;
        gzip_static on;
        access_log off;
    }
    # Media OCHIQ EMAS: Django ruxsatni tekshiradi va X-Accel-Redirect bilan shu yerga yuboradi
    location /protected-media/ {
        internal;
        alias /media/;
    }
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

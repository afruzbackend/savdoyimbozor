# Uch interfeys ham bitta web'ga proksi qilinadi — Django host-routing o'zi ajratadi
# (sotuvchi.* / nazorat.* / panel.*). Statik va media nginx orqali beriladi.
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /static/ {
        alias /static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /media/;
        expires 7d;
    }
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

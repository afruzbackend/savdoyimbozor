# Konteyner loglari cheklanadi: aks holda json log fayllari oylar davomida diskni to'ldiradi
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# DIQQAT: web/celery/beat .env faylini TO'LIQ oladi (env_file) — SMS_*, TELEGRAM_BOT_TOKEN, API_RATE_*,
# RECOMPUTE_EVERY_MIN va h.k. Ilgari faqat quyida nomi yozilganlar o'tardi: .env dagi SMS/Telegram
# sozlamasi konteynerga yetmay, jimgina o'chiq qolardi. Quyidagi qiymatlar .env'dagidan ustun.
x-django-env: &django_env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  # Majburiy: .env da SECRET_KEY (python -c "import secrets; print(secrets.token_urlsafe(50))")
  SECRET_KEY: ${SECRET_KEY:?.env faylida SECRET_KEY o'rnating}
  DEBUG: "False"
  # Dev .env nusxasidan eager rejim prod'ga o'tib ketmasin (fon vazifalari web ichida bajarilardi)
  CELERY_TASK_ALWAYS_EAGER: "False"
  DATABASE_URL: postgres://bozor:${DB_PASSWORD:-bozor}@db:5432/bozor
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CACHE_URL: redis://redis:6379/2
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  # Lokal Docker demo http://localhost orqali — HTTPS majburlash va secure-cookie o'chirilgan.
  # Haqiqiy prod (https) uchun bularni "True" / HSTS>0 qiling.
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  SECURE_HSTS_SECONDS: "0"
  # Media nginx orqali, lekin Django ruxsat tekshiradi (X-Accel-Redirect)
  MEDIA_X_ACCEL: "True"
  # nginx X-Real-IP beradi — audit jurnalidagi IP soxtalashtirilmaydi
  BEHIND_PROXY: "True"
  # Zaxira: har kecha 02:30 (celery beat). Tashqi joyga yuborish SHART (server bozorda bo'lsa):
  # masalan: BACKUP_UPLOAD_CMD="rclone copy {path} offsite:bozor-backup"
  BACKUP_DIR: /backups
  BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
  # Soliq / onlayn kassa deklaratsiyasi (bo'sh — faqat Excel). inbox: /tax_inbox ga fayl tashlanadi
  TAX_ADAPTER: ${TAX_ADAPTER:-}
  TAX_API_URL: ${TAX_API_URL:-}
  TAX_API_TOKEN: ${TAX_API_TOKEN:-}
  TAX_API_FIELDS: ${TAX_API_FIELDS:-}
  TAX_API_AMOUNT_DIVISOR: ${TAX_API_AMOUNT_DIVISOR:-1}
  TAX_INBOX_DIR: /tax_inbox

services:
  db:
    logging: *default_logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bozor
      POSTGRES_USER: bozor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bozor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    logging: *default_logging
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    logging: *default_logging
    env_file:
      - path: .env
        required: false
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      <<: *django_env
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - backups:/backups
      - tax_inbox:/tax_inbox
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    # Baza/kesh ishlamasa /healthz/ 503 qaytaradi — Docker konteynerni nosoz deb belgilaydi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    logging: *default_logging
    env_file:
      - path: .env
        required: false
    build: .
    command: celery -A config worker -l info
    environment: *django_env
    volumes:
      - media:/app/media
      - backups:/backups
      - tax_inbox:/tax_inbox
    depends_on:
      - db
      - redis

  beat:
    logging: *default_logging
    env_file:
      - path: .env
        required: false
    build: .
    command: celery -A config beat -l info
    environment: *django_env
    depends_on:
      - db
      - redis

  nginx:
    logging: *default_logging
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      - web

volumes:
  backups:
  tax_inbox:
  pgdata:
  redisdata:
  static:
  media:

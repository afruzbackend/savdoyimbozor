x-django-env: &django_env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: "False"
  DATABASE_URL: postgres://bozor:${DB_PASSWORD:-bozor}@db:5432/bozor
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SECURE_SSL_REDIRECT: "False"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bozor
      POSTGRES_USER: bozor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bozor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      <<: *django_env
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  celery:
    build: .
    command: celery -A config worker -l info
    environment: *django_env
    volumes:
      - media:/app/media
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    environment: *django_env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static:
  media:

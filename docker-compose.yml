x-django-env: &django_env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: "False"
  DATABASE_URL: postgres://bozor:${DB_PASSWORD:-bozor}@db:5432/bozor
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
  # Lokal Docker demo http://localhost orqali — HTTPS majburlash va secure-cookie o'chirilgan.
  # Haqiqiy prod (https) uchun bularni "True" / HSTS>0 qiling.
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  SECURE_HSTS_SECONDS: "0"
  # Media nginx orqali, lekin Django ruxsat tekshiradi (X-Accel-Redirect)
  MEDIA_X_ACCEL: "True"
  # Zaxira: har kecha 02:30 (celery beat). Tashqi joyga yuborish SHART (server bozorda bo'lsa):
  # masalan: BACKUP_UPLOAD_CMD="rclone copy {path} offsite:bozor-backup"
  BACKUP_DIR: /backups
  BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
  # Soliq / onlayn kassa deklaratsiyasi (bo'sh — faqat Excel). inbox: /tax_inbox ga fayl tashlanadi
  TAX_ADAPTER: ${TAX_ADAPTER:-}
  TAX_API_URL: ${TAX_API_URL:-}
  TAX_API_TOKEN: ${TAX_API_TOKEN:-}
  TAX_API_FIELDS: ${TAX_API_FIELDS:-}
  TAX_API_AMOUNT_DIVISOR: ${TAX_API_AMOUNT_DIVISOR:-1}
  TAX_INBOX_DIR: /tax_inbox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bozor
      POSTGRES_USER: bozor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bozor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      <<: *django_env
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - backups:/backups
      - tax_inbox:/tax_inbox
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  celery:
    build: .
    command: celery -A config worker -l info
    environment: *django_env
    volumes:
      - media:/app/media
      - backups:/backups
      - tax_inbox:/tax_inbox
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    environment: *django_env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      - web

volumes:
  backups:
  tax_inbox:
  pgdata:
  redisdata:
  static:
  media:

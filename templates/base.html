{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'uz' }}"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}Bozor Nazorat{% endblock %}</title>
  <meta name="theme-color" content="#3a4e8c">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{% static 'fonts/inter-v20-cyrillic_latin-regular.woff2' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>
  {% block body %}{% endblock %}

  {# Toast konteyner (Alpine store) #}
  <div class="toast-wrap" x-data x-cloak>
    <template x-for="t in $store.toasts.items" :key="t.id">
      <div class="toast" :class="t.kind" x-transition>
        <svg class="icon" :class="{'':true}"><use href="{% static 'icons/sprite.svg' %}#i-circle-check"></use></svg>
        <span class="grow" x-text="t.msg"></span>
        <button class="btn-quiet btn-icon" @click="$store.toasts.remove(t.id)" aria-label="Yopish">
          <svg class="icon-sm"><use href="{% static 'icons/sprite.svg' %}#i-x"></use></svg>
        </button>
      </div>
    </template>
  </div>

  <script src="{% static 'js/components.js' %}"></script>
  <script src="{% static 'js/i18n.js' %}"></script>
  <script defer src="{% static 'js/alpine.min.js' %}"></script>
  <script defer src="{% static 'js/htmx.min.js' %}"></script>
  <style>[x-cloak]{display:none!important}</style>
  {% block extra_js %}{% endblock %}
</body>
</html>

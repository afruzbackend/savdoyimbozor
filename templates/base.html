{% load static i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'uz' }}" {% if theme %}data-theme="{{ theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}Bozor Nazorat{% endblock %}</title>
  {# P1: tokens.css + shriftlar shu yerga ulanadi #}
  <style>
    /* P0 vaqtinchalik minimal uslub — P1 dizayn tizimi bilan almashtiriladi */
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f2ee;color:#1a1a1a}
    .wrap{max-width:960px;margin:0 auto;padding:24px}
    a{color:#2a4a7a}
    .card{background:#fff;border:1px solid #e2ddd4;border-radius:12px;padding:20px;margin-bottom:16px}
    input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #ccc}
    button{background:#2a4a7a;color:#fff;border:none;cursor:pointer}
    .msg{padding:10px 14px;border-radius:8px;margin-bottom:10px;background:#eef}
    .msg.error{background:#fee;color:#900}.msg.success{background:#efe;color:#060}
  </style>
</head>
<body>
  <div class="wrap">
    {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>

{% extends 'base.html' %}
{% block heading %}Hisobdan chiqarish{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  <h3>{{ shop.name }} — chirigan/buzilgan mahsulot</h3>
  <p class="muted">Foto majburiy. Me'yordan oshsa tizim signal beradi.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Mahsulot</label>
    <input name="product_name" required>
    <label>Miqdor</label>
    <input name="quantity" type="number" step="0.1" inputmode="decimal" required>
    <label>Birlik</label>
    <select name="unit"><option>kg</option><option>dona</option><option>quti</option><option>qop</option></select>
    <label>Foto (majburiy)</label>
    <input type="file" name="photo" accept="image/*" capture="environment" required>
    <label>Sabab</label>
    <input name="reason" placeholder="masalan: chirib qolgan">
    <button class="btn big" style="margin-top:18px">Saqlash</button>
    <a class="btn gray big" style="margin-top:10px" href="{% url 'events:sale_create' %}">← Orqaga</a>
  </form>
</div>
{% endblock %}

{# Koshin/islimiy geometrik naqsh — qo'lda chizilgan SVG pattern.
   currentColor + past opacity; FAQAT login foni va bo'sh holatlarda ishlatiladi. #}
<svg class="koshin" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
     style="position:absolute;inset:0;width:100%;height:100%;color:currentColor;{{ style }}">
  <defs>
    <pattern id="koshin-tile" width="80" height="80" patternUnits="userSpaceOnUse"
             patternTransform="rotate(0)">
      {# 8-burchakli yulduz (koshin) + bog'lovchi chiziqlar #}
      <g fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.5">
        <path d="M40 6 L49 21 L66 21 L57 36 L66 51 L49 51 L40 66 L31 51 L14 51 L23 36 L14 21 L31 21 Z"/>
        <circle cx="40" cy="36" r="7"/>
        <path d="M40 -14 L49 1 M31 1 L40 -14 M0 36 L14 36 M66 36 L80 36 M40 66 L40 80"/>
        <path d="M0 0 L14 21 M80 0 L66 21 M0 72 L14 51 M80 72 L66 51"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#koshin-tile)"/>
</svg>
{% comment %}Har chaqiruvda pattern id takrorlanmasligi uchun bitta sahifada bir marta ishlatiladi.{% endcomment %}

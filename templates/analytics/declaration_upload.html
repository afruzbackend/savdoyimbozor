{% extends 'base.html' %}
{% block heading %}Deklaratsiya yuklash{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <h3>Excel fayl yuklash</h3>
  <p class="muted">Ustunlar tartibi: <b>STIR | Yil | Oy | Summa</b> (1-qator sarlavha).</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Excel fayl (.xlsx)</label>
    <input type="file" name="file" accept=".xlsx" required>
    <button class="btn" style="margin-top:16px">Yuklash</button>
  </form>
</div>
{% endblock %}

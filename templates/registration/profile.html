{% extends 'base.html' %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ user.get_full_name|default:user.username }}</h2>
  <p>Rol: {{ user.get_role_display }}</p>
  {% if user.shop %}<p>Do'kon: {{ user.shop }}</p>{% endif %}
  <p><a href="{% url 'password_change' %}">Parolni almashtirish</a></p>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Chiqish</button></form>
</div>
{% endblock %}

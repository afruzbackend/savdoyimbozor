{% extends 'base.html' %}
{% block title %}Parol{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>Parolni almashtirish</h2>
  {% if forced %}<p class="msg">Birinchi kirish — yangi parol o'rnating.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><input name="password1" type="password" placeholder="Yangi parol" required style="width:100%"></p>
    <p><input name="password2" type="password" placeholder="Takrorlang" required style="width:100%"></p>
    <button type="submit" style="width:100%">Saqlash</button>
  </form>
</div>
{% endblock %}
